name: Publish to Edge Add-ons

# 仅打 tag（v*.*.*）时发布；版本号必须与 public/manifest.json、package.json 一致（脚本校验会拦住不一致）。
# 需要仓库 secrets：EDGE_CLIENT_ID / EDGE_API_KEY / EDGE_PRODUCT_ID（Partner Center → Publish API 页获取）。
on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  publish:
    name: Build & publish Edge Add-ons update
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Verify tag matches manifest & package versions
        run: |
          TAG="${GITHUB_REF_NAME}"
          PKG="$(node -p "require('./public/manifest.json').version")"
          NPM_PKG="$(node -p "require('./package.json').version")"
          echo "tag=$TAG manifest=$PKG package.json=$NPM_PKG"
          if [ "$TAG" != "v$PKG" ] || [ "$PKG" != "$NPM_PKG" ]; then
            echo "::error::tag ($TAG) 与 public/manifest.json ($PKG) / package.json ($NPM_PKG) 不一致"
            exit 1
          fi

      - name: Zip dist/ and verify manifest inside
        run: |
          python3 - <<'EOF'
          import zipfile, os, json, sys
          tag = os.environ['GITHUB_REF_NAME']
          dst = f'1688-helper-{tag}.zip'
          n = 0
          with zipfile.ZipFile(dst, 'w', zipfile.ZIP_DEFLATED) as z:
              for root, _, files in os.walk('dist'):
                  for f in files:
                      if f.startswith('.'):
                          continue
                      full = os.path.join(root, f)
                      z.write(full, os.path.relpath(full, 'dist'))
                      n += 1
          with zipfile.ZipFile(dst) as z:
              m = json.loads(z.read('manifest.json'))
          expect = tag.lstrip('v')
          if m.get('version') != expect:
              sys.exit(f'manifest inside zip is {m.get("version")}, expected {expect}')
          print(f'created {dst}: {n} files, {os.path.getsize(dst)} bytes, manifest version {m["version"]}')
          EOF

      - name: Publish to Edge Add-ons
        env:
          EDGE_CLIENT_ID: ${{ secrets.EDGE_CLIENT_ID }}
          EDGE_API_KEY: ${{ secrets.EDGE_API_KEY }}
          EDGE_PRODUCT_ID: ${{ secrets.EDGE_PRODUCT_ID }}
        # Notes for certification：取 tag 指向的提交信息（tag push 的事件体里没有 head_commit）
        run: |
          NOTES="$(git log -1 --pretty=%s "$GITHUB_REF_NAME" 2>/dev/null || echo "Release $GITHUB_REF_NAME")"
          node scripts/publish-edge.mjs "1688-helper-${GITHUB_REF_NAME}.zip" "$NOTES"
